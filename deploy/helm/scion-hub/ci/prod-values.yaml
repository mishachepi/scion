image:
  repository: ghcr.io/example/scion-hub
  tag: v0.1.0
hub:
  publicUrl: https://hub.example.test
  adminEmails: [me@example.test]
  authorizedDomains: [example.test]
auth:
  mode: oauth
  existingSecret: scion-auth-byo  # bring-your-own
  # below ignored because existingSecret set
gateway:
  hostnames: [hub.example.test]
  parentRefs:
    - name: prod-gateway
      namespace: gateway-system
      sectionName: https
persistence:
  size: 20Gi
  storageClass: fast-ssd
  annotations:
    helm.sh/resource-policy: keep
imageRegistry: ghcr.io/example
podDisruptionBudget:
  enabled: true
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
