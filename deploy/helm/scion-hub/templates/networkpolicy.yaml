{{- /*
Ingress restriction for the hub pod: only the named sources reach the web
port. The default source is the release's own namespace, which fits the NEG
path (the load balancer health-checks and forwards from outside the policy's
reach on most CNIs) poorly and a Gateway deployment well - a Gateway in
another namespace needs an explicit networkPolicy.ingressFrom entry naming
that namespace.

Ingress ONLY, deliberately. An egress section was considered and rejected:
the hub legitimately dials identity providers, container registries and
whatever its integrations name, so any egress rule this chart could write
would either break those or end in an allow-everything entry - and a policy
that claims Egress and then allows everything is the appearance of a
boundary, which is worse than stating none.
*/}}
{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "scion-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion-hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "scion-hub.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ int .Values.hub.webPort }}
{{- end }}
