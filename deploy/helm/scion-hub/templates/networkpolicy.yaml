{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "scion-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion-hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "scion-hub.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        # Allow from any pod in the same namespace by default.
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ int .Values.hub.port }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow all egress (OAuth providers, registries, agent dispatches).
    # Tighten further in production by listing specific destinations.
    - {}
{{- end }}
