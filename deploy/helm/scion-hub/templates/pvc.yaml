{{- /*
The claim behind the hub's state directory when persistence.enabled is true.
Skipped under persistence.existingClaim: the operator owns that claim's
lifecycle, and rendering a second one beside it would create an empty volume
whose name suggests it holds the data.

Deleting this claim deletes the hub's database when the driver is sqlite.
helm uninstall deletes rendered PVCs with the release; an operator who wants
the claim to outlive the release sets helm.sh/resource-policy: keep through
persistence.annotations.
*/}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "scion-hub.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion-hub.labels" . | nindent 4 }}
  {{- with .Values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
