{{- /*
  Auth Secret — rendered only when the user is not bringing their own via
  auth.existingSecret. Holds the session secret, dev-token (if set), and any
  OAuth client_id/secret pairs that are provided inline.

  Generated values (sessionSecret when empty) use lookup() so they persist
  across `helm upgrade`. On first install lookup returns nothing and we fall
  back to a fresh randAlphaNum.
*/ -}}
{{- if not .Values.auth.existingSecret -}}
{{- include "scion-hub.validate" . -}}

{{- $name := include "scion-hub.authSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{- /* session secret: explicit > existing > generated */ -}}
{{- $sessionSecret := .Values.auth.sessionSecret -}}
{{- if not $sessionSecret -}}
  {{- if $existing -}}
    {{- $sessionSecret = index $existing.data "session-secret" | b64dec -}}
  {{- else -}}
    {{- $sessionSecret = randAlphaNum 64 -}}
  {{- end -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion-hub.labels" . | nindent 4 }}
  {{- with (include "scion-hub.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  session-secret: {{ $sessionSecret | quote }}
  {{- with .Values.auth.dev.token }}
  dev-token: {{ . | quote }}
  {{- end }}
  {{- if eq .Values.auth.mode "oauth" }}
  {{- with .Values.auth.oauth.google.web.clientId }}
  oauth-google-web-client-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.oauth.google.web.clientSecret }}
  oauth-google-web-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.oauth.google.cli.clientId }}
  oauth-google-cli-client-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.oauth.google.cli.clientSecret }}
  oauth-google-cli-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.oauth.github.web.clientId }}
  oauth-github-web-client-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.oauth.github.web.clientSecret }}
  oauth-github-web-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.oauth.github.cli.clientId }}
  oauth-github-cli-client-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.oauth.github.cli.clientSecret }}
  oauth-github-cli-client-secret: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.discord.webhookUrl }}
  discord-webhook-url: {{ . | quote }}
  {{- end }}
{{- end }}
