# Source: scion-hub/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scion-scion-hub
  namespace: scion-system
  labels:
    helm.sh/chart: scion-hub-0.1.0
    app.kubernetes.io/name: scion-hub
    app.kubernetes.io/instance: scion
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: scion
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scion-hub
      app.kubernetes.io/instance: scion
  template:
    metadata:
      labels:
        helm.sh/chart: scion-hub-0.1.0
        app.kubernetes.io/name: scion-hub
        app.kubernetes.io/instance: scion
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: scion
      annotations:
        scion.io/hub-id: "ci-selfhost"
        checksum/env-config: fb6aa377012245147443f44c593bf306178f41b45f5c4cbafcac71d4c530803f
        checksum/settings: c9ea59705ac3fda1b50aedb6b5c4b66d7bf29d62d00320e7a9eabafacbb6a483
    spec:
      serviceAccountName: scion-scion-hub
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: hub
          image: "registry.selfhost.example.com/scion-hub-gke:ci"
          imagePullPolicy: IfNotPresent
          args:
            - server
            - start
            - --foreground
            - --hosted
            - --enable-hub
            - --enable-web
            - --web-port
            - "8080"
            - --host
            - 0.0.0.0
            - --auto-provide
            - --global
          envFrom:
            - configMapRef:
                name: scion-scion-hub-env
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: scion-home
              mountPath: "/home/scion/.scion"
            - name: settings
              mountPath: "/home/scion/.scion/settings.yaml"
              subPath: settings.yaml
              readOnly: true
      volumes:
        - name: scion-home
          persistentVolumeClaim:
            claimName: scion-scion-hub-data
        - name: settings
          secret:
            secretName: scion-scion-hub-settings
            defaultMode: 0444
            items:
              - key: settings.yaml
                path: settings.yaml
