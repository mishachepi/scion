# Source: scion-hub/templates/backup-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scion-scion-hub-backup
  namespace: scion-system
  labels:
    helm.sh/chart: scion-hub-0.1.0
    app.kubernetes.io/name: scion-hub
    app.kubernetes.io/instance: scion
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: scion
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scion-hub-backup
            app.kubernetes.io/instance: scion
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: backup
              image: "registry.selfhost.example.com/sqlite@sha256:1111111111111111111111111111111111111111111111111111111111111111"
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  TS=$(date +%Y%m%d-%H%M%S)
                  OUT="/backup/hub-${TS}.db"
                  echo "[backup] snapshotting hub.db -> ${OUT}"
                  sqlite3 /data/hub.db ".backup '${OUT}'"
                  echo "[backup] integrity: $(sqlite3 "${OUT}" 'PRAGMA integrity_check;')"
                  KEEP=7
                  echo "[backup] rotating, keeping last ${KEEP}"
                  ls -1t /backup/hub-*.db 2>/dev/null | tail -n +$((KEEP + 1)) | while read -r f; do
                    echo "[backup] removing old $f"; rm -f "$f"
                  done
                  echo "[backup] done"
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: scion-scion-hub-data
            - name: backup
              persistentVolumeClaim:
                claimName: scion-scion-hub-backups
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
